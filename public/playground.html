<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Copilot API Playground</title>
  <style>
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --surface2: #1c2128;
      --border: #30363d;
      --text: #e6edf3;
      --text-muted: #8b949e;
      --accent: #58a6ff;
      --accent-hover: #79c0ff;
      --green: #3fb950;
      --red: #f85149;
      --orange: #d29922;
      --purple: #bc8cff;
      --radius: 8px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    .header h1 {
      font-size: 16px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .header h1 .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--red);
      transition: background 0.3s;
    }
    .header h1 .dot.connected { background: var(--green); }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* Inputs & Selects */
    input, select, textarea {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: var(--radius);
      padding: 6px 10px;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus, select:focus, textarea:focus {
      border-color: var(--accent);
    }
    select { cursor: pointer; }

    /* Buttons */
    button {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: var(--radius);
      padding: 6px 14px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.15s;
    }
    button:hover { border-color: var(--accent); color: var(--accent); }
    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    button.primary:hover {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
    }
    button.danger { color: var(--red); }
    button.danger:hover { border-color: var(--red); }

    /* Layout */
    .main {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    /* Sidebar */
    .sidebar {
      width: 300px;
      border-right: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }
    .sidebar-section {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
    }
    .sidebar-section label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-bottom: 6px;
    }
    .sidebar-section input,
    .sidebar-section select,
    .sidebar-section textarea {
      width: 100%;
    }
    .sidebar-section textarea {
      min-height: 80px;
      resize: vertical;
      font-family: inherit;
    }

    /* Protocol toggle */
    .protocol-toggle {
      display: flex;
      background: var(--bg);
      border-radius: var(--radius);
      padding: 2px;
      gap: 2px;
    }
    .protocol-toggle button {
      flex: 1;
      border: none;
      background: transparent;
      padding: 6px 0;
      font-size: 12px;
      font-weight: 500;
      border-radius: 6px;
      color: var(--text-muted);
    }
    .protocol-toggle button.active {
      background: var(--accent);
      color: #fff;
    }
    .protocol-toggle button:hover:not(.active) {
      color: var(--text);
    }

    /* Model filter */
    .model-filter {
      margin-bottom: 8px;
    }
    .model-list {
      max-height: 200px;
      overflow-y: auto;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg);
    }
    .model-item {
      padding: 6px 10px;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      transition: background 0.1s;
    }
    .model-item:last-child { border-bottom: none; }
    .model-item:hover { background: var(--surface2); }
    .model-item.selected { background: var(--surface2); color: var(--accent); }
    .model-item .vendor {
      font-size: 10px;
      color: var(--text-muted);
      padding: 1px 6px;
      background: var(--surface);
      border-radius: 4px;
    }
    .model-item .vendor.openai { color: var(--green); }
    .model-item .vendor.google { color: var(--orange); }
    .model-item .vendor.anthropic { color: var(--purple); }
    .model-item .vendor.xai { color: var(--red); }

    /* Custom model input */
    .custom-model {
      margin-top: 8px;
      display: flex;
      gap: 6px;
    }
    .custom-model input { flex: 1; }

    /* Params */
    .params-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .param-item label { margin-bottom: 3px; }
    .param-item input { width: 100%; }

    /* Chat area */
    .chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .message {
      display: flex;
      gap: 12px;
      max-width: 85%;
    }
    .message.user { align-self: flex-end; flex-direction: row-reverse; }
    .message.assistant { align-self: flex-start; }

    .message .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
    }
    .message.user .avatar { background: var(--accent); }
    .message.assistant .avatar { background: var(--purple); }

    .message .bubble {
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .message.user .bubble {
      background: var(--accent);
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .message.assistant .bubble {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }
    .message.error .bubble {
      background: rgba(248, 81, 73, 0.1);
      border-color: var(--red);
      color: var(--red);
    }

    /* Streaming indicator */
    .streaming-dot::after {
      content: '';
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      margin-left: 4px;
      animation: blink 1s infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* Input bar */
    .input-bar {
      padding: 16px 20px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 10px;
      background: var(--surface);
    }
    .input-bar textarea {
      flex: 1;
      min-height: 42px;
      max-height: 150px;
      resize: none;
      padding: 10px 14px;
      font-size: 14px;
      line-height: 1.5;
      border-radius: 12px;
    }
    .input-bar .actions {
      display: flex;
      flex-direction: column;
      gap: 6px;
      justify-content: flex-end;
    }
    .input-bar button {
      height: 36px;
      min-width: 70px;
      border-radius: 12px;
    }

    /* Status bar */
    .status-bar {
      padding: 4px 20px;
      font-size: 11px;
      color: var(--text-muted);
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
    }

    /* Toggle */
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 4px;
    }
    .toggle-row span { font-size: 12px; }
    .toggle {
      width: 36px; height: 20px;
      background: var(--border);
      border-radius: 10px;
      cursor: pointer;
      position: relative;
      transition: background 0.2s;
    }
    .toggle.on { background: var(--accent); }
    .toggle::after {
      content: '';
      position: absolute;
      width: 16px; height: 16px;
      border-radius: 50%;
      background: #fff;
      top: 2px; left: 2px;
      transition: transform 0.2s;
    }
    .toggle.on::after { transform: translateX(16px); }

    /* Empty state */
    .empty-state {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      font-size: 14px;
      flex-direction: column;
      gap: 8px;
    }
    .empty-state .icon { font-size: 40px; opacity: 0.5; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

    /* Raw response viewer */
    .raw-response {
      margin-top: 6px;
      font-size: 11px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px;
      max-height: 150px;
      overflow: auto;
      font-family: 'SF Mono', Monaco, 'Cascadia Code', monospace;
      white-space: pre-wrap;
      word-break: break-all;
      color: var(--text-muted);
      display: none;
    }
    .raw-response.show { display: block; }
  </style>
</head>
<body>

<div class="header">
  <h1>
    <span class="dot" id="statusDot"></span>
    Copilot API Playground
  </h1>
  <div class="header-controls">
    <input id="baseUrl" type="text" value="" style="width:220px" placeholder="API Base URL (留空=同源)">
    <button onclick="checkConnection()">连接测试</button>
    <button onclick="fetchModels()">刷新模型</button>
    <button class="danger" onclick="clearChat()">清空对话</button>
  </div>
</div>

<div class="main">
  <div class="sidebar">
    <!-- Protocol -->
    <div class="sidebar-section">
      <label>协议 / Protocol</label>
      <div class="protocol-toggle">
        <button class="active" onclick="setProtocol('openai', this)">OpenAI</button>
        <button onclick="setProtocol('anthropic', this)">Anthropic</button>
      </div>
    </div>

    <!-- Model -->
    <div class="sidebar-section">
      <label>模型 / Model</label>
      <input class="model-filter" type="text" id="modelFilter" placeholder="搜索模型..." oninput="filterModels()">
      <div class="model-list" id="modelList">
        <div class="empty-state" style="padding:20px;font-size:12px;">点击「刷新模型」加载列表</div>
      </div>
      <div class="custom-model">
        <input id="customModel" type="text" placeholder="自定义模型名..." value="">
        <button onclick="useCustomModel()">使用</button>
      </div>
      <div style="margin-top:6px;font-size:11px;color:var(--text-muted)">
        当前: <span id="currentModel" style="color:var(--accent)">gpt-4o</span>
      </div>
    </div>

    <!-- Parameters -->
    <div class="sidebar-section">
      <label>参数 / Parameters</label>
      <div class="params-grid">
        <div class="param-item">
          <label>Max Tokens</label>
          <input id="maxTokens" type="number" value="2048" min="1">
        </div>
        <div class="param-item">
          <label>Temperature</label>
          <input id="temperature" type="number" value="0.7" min="0" max="2" step="0.1">
        </div>
        <div class="param-item">
          <label>Top P</label>
          <input id="topP" type="number" value="1" min="0" max="1" step="0.1">
        </div>
        <div class="param-item">
          <label>Frequency Penalty</label>
          <input id="freqPenalty" type="number" value="0" min="-2" max="2" step="0.1">
        </div>
      </div>
      <div class="toggle-row" style="margin-top:10px">
        <span>流式输出 / Stream</span>
        <div class="toggle on" id="streamToggle" onclick="toggleStream()"></div>
      </div>
      <div class="toggle-row" style="margin-top:6px">
        <span>显示原始响应</span>
        <div class="toggle" id="rawToggle" onclick="toggleRaw()"></div>
      </div>
    </div>

    <!-- System Prompt -->
    <div class="sidebar-section">
      <label>系统提示词 / System Prompt</label>
      <textarea id="systemPrompt" placeholder="可选的系统提示词...">You are a helpful assistant.</textarea>
    </div>
  </div>

  <div class="chat-area">
    <div class="messages" id="messages">
      <div class="empty-state">
        <div class="icon">&#x1F680;</div>
        <div>发送消息开始对话</div>
        <div style="font-size:12px">支持 OpenAI 和 Anthropic 协议</div>
      </div>
    </div>
    <div class="input-bar">
      <textarea id="userInput" placeholder="输入消息... (Enter 发送, Shift+Enter 换行)" rows="1"></textarea>
      <div class="actions">
        <button class="primary" id="sendBtn" onclick="sendMessage()">发送</button>
        <button id="stopBtn" onclick="stopGeneration()" style="display:none" class="danger">停止</button>
      </div>
    </div>
    <div class="status-bar">
      <span id="statusText">就绪</span>
      <span id="tokenInfo"></span>
    </div>
  </div>
</div>

<script>
  // State
  let protocol = 'openai';
  let selectedModel = 'gpt-4o';
  let stream = true;
  let showRaw = false;
  let chatHistory = [];
  let allModels = [];
  let abortController = null;

  // DOM
  const $ = id => document.getElementById(id);

  // Auto-resize textarea
  $('userInput').addEventListener('input', function() {
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 150) + 'px';
  });

  // Enter to send
  $('userInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  // Protocol toggle
  function setProtocol(p, btn) {
    protocol = p;
    document.querySelectorAll('.protocol-toggle button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  }

  // Stream toggle
  function toggleStream() {
    stream = !stream;
    $('streamToggle').classList.toggle('on');
  }

  // Raw toggle
  function toggleRaw() {
    showRaw = !showRaw;
    $('rawToggle').classList.toggle('on');
    document.querySelectorAll('.raw-response').forEach(el => {
      el.classList.toggle('show', showRaw);
    });
  }

  // Connection test
  async function checkConnection() {
    const dot = $('statusDot');
    try {
      const res = await fetch(`${$('baseUrl').value}/`, { mode: 'cors' });
      const text = await res.text();
      dot.classList.toggle('connected', res.ok);
      setStatus(res.ok ? `已连接: ${text}` : `连接失败: ${res.status}`);
    } catch(e) {
      dot.classList.remove('connected');
      setStatus(`连接失败: ${e.message}`);
    }
  }

  // Fetch models
  async function fetchModels() {
    setStatus('正在获取模型列表...');
    try {
      const res = await fetch(`${$('baseUrl').value}/v1/models`);
      const data = await res.json();
      allModels = data.data || [];
      renderModels(allModels);
      setStatus(`已加载 ${allModels.length} 个模型`);
      $('statusDot').classList.add('connected');
    } catch(e) {
      setStatus(`获取模型失败: ${e.message}`);
      $('statusDot').classList.remove('connected');
    }
  }

  // Render model list
  function renderModels(models) {
    const list = $('modelList');
    if (!models.length) {
      list.innerHTML = '<div class="empty-state" style="padding:20px;font-size:12px;">无匹配模型</div>';
      return;
    }
    list.innerHTML = models.map(m => {
      const vendorClass = (m.owned_by || '').toLowerCase().includes('openai') ? 'openai'
        : (m.owned_by || '').toLowerCase().includes('google') ? 'google'
        : (m.owned_by || '').toLowerCase().includes('anthropic') ? 'anthropic'
        : (m.owned_by || '').toLowerCase().includes('xai') ? 'xai' : '';
      return `<div class="model-item ${m.id === selectedModel ? 'selected' : ''}"
                   onclick="selectModel('${m.id}', this)">
        <span>${m.display_name || m.id}</span>
        <span class="vendor ${vendorClass}">${m.owned_by || 'unknown'}</span>
      </div>`;
    }).join('');
  }

  // Filter models
  function filterModels() {
    const q = $('modelFilter').value.toLowerCase();
    const filtered = allModels.filter(m =>
      m.id.toLowerCase().includes(q) ||
      (m.display_name || '').toLowerCase().includes(q) ||
      (m.owned_by || '').toLowerCase().includes(q)
    );
    renderModels(filtered);
  }

  // Select model
  function selectModel(id, el) {
    selectedModel = id;
    $('currentModel').textContent = id;
    document.querySelectorAll('.model-item').forEach(e => e.classList.remove('selected'));
    if (el) el.classList.add('selected');
  }

  // Custom model
  function useCustomModel() {
    const v = $('customModel').value.trim();
    if (v) {
      selectedModel = v;
      $('currentModel').textContent = v;
      document.querySelectorAll('.model-item').forEach(e => e.classList.remove('selected'));
    }
  }

  // Status
  function setStatus(text) {
    $('statusText').textContent = text;
  }

  // Clear chat
  function clearChat() {
    chatHistory = [];
    $('messages').innerHTML = `
      <div class="empty-state">
        <div class="icon">&#x1F680;</div>
        <div>发送消息开始对话</div>
        <div style="font-size:12px">支持 OpenAI 和 Anthropic 协议</div>
      </div>`;
    $('tokenInfo').textContent = '';
  }

  // Add message to UI
  function addMessageUI(role, content) {
    // Remove empty state
    const empty = $('messages').querySelector('.empty-state');
    if (empty) empty.remove();

    const div = document.createElement('div');
    div.className = `message ${role}`;
    const avatar = role === 'user' ? 'U' : 'A';
    div.innerHTML = `
      <div class="avatar">${avatar}</div>
      <div>
        <div class="bubble">${escapeHtml(content)}</div>
        <div class="raw-response ${showRaw ? 'show' : ''}"></div>
      </div>`;
    $('messages').appendChild(div);
    $('messages').scrollTop = $('messages').scrollHeight;
    return div;
  }

  function escapeHtml(text) {
    const d = document.createElement('div');
    d.textContent = text;
    return d.innerHTML;
  }

  // Send message
  async function sendMessage() {
    const input = $('userInput').value.trim();
    if (!input) return;

    $('userInput').value = '';
    $('userInput').style.height = 'auto';

    // Add user message
    chatHistory.push({ role: 'user', content: input });
    addMessageUI('user', input);

    // Prepare assistant message
    const assistantDiv = addMessageUI('assistant', '');
    const bubble = assistantDiv.querySelector('.bubble');
    const rawDiv = assistantDiv.querySelector('.raw-response');
    bubble.classList.add('streaming-dot');

    // Show stop button
    $('sendBtn').style.display = 'none';
    $('stopBtn').style.display = '';

    abortController = new AbortController();
    const startTime = Date.now();

    try {
      if (protocol === 'openai') {
        await sendOpenAI(bubble, rawDiv, abortController.signal);
      } else {
        await sendAnthropic(bubble, rawDiv, abortController.signal);
      }
    } catch(e) {
      if (e.name !== 'AbortError') {
        bubble.classList.remove('streaming-dot');
        const errDiv = addMessageUI('error', `错误: ${e.message}`);
        chatHistory.pop(); // Remove failed assistant response
      }
    }

    bubble.classList.remove('streaming-dot');
    $('sendBtn').style.display = '';
    $('stopBtn').style.display = 'none';
    const elapsed = ((Date.now() - startTime) / 1000).toFixed(1);
    setStatus(`完成 (${elapsed}s)`);
    abortController = null;
  }

  // OpenAI protocol
  async function sendOpenAI(bubble, rawDiv, signal) {
    const messages = [];
    const sys = $('systemPrompt').value.trim();
    if (sys) messages.push({ role: 'system', content: sys });
    messages.push(...chatHistory);

    const body = {
      model: selectedModel,
      messages,
      max_tokens: parseInt($('maxTokens').value),
      temperature: parseFloat($('temperature').value),
      top_p: parseFloat($('topP').value),
      frequency_penalty: parseFloat($('freqPenalty').value),
      stream,
    };

    setStatus(`请求中... [OpenAI] ${selectedModel}`);

    const res = await fetch(`${$('baseUrl').value}/v1/chat/completions`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
      signal,
    });

    if (!res.ok) {
      const errText = await res.text();
      throw new Error(`${res.status}: ${errText}`);
    }

    let fullContent = '';
    let rawChunks = '';

    if (stream) {
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n');
        buffer = lines.pop() || '';

        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          const data = line.slice(6);
          if (data === '[DONE]') continue;

          rawChunks += data + '\n';
          try {
            const json = JSON.parse(data);
            const delta = json.choices?.[0]?.delta?.content || '';
            fullContent += delta;
            bubble.innerHTML = escapeHtml(fullContent);
            $('messages').scrollTop = $('messages').scrollHeight;

            // Usage info
            if (json.usage) {
              $('tokenInfo').textContent =
                `Tokens: ${json.usage.prompt_tokens} in / ${json.usage.completion_tokens} out / ${json.usage.total_tokens} total`;
            }
          } catch {}
        }
      }
    } else {
      const json = await res.json();
      rawChunks = JSON.stringify(json, null, 2);
      fullContent = json.choices?.[0]?.message?.content || '';
      bubble.innerHTML = escapeHtml(fullContent);

      if (json.usage) {
        $('tokenInfo').textContent =
          `Tokens: ${json.usage.prompt_tokens} in / ${json.usage.completion_tokens} out / ${json.usage.total_tokens} total`;
      }
    }

    rawDiv.textContent = rawChunks;
    chatHistory.push({ role: 'assistant', content: fullContent });
  }

  // Anthropic protocol
  async function sendAnthropic(bubble, rawDiv, signal) {
    const messages = chatHistory.map(m => ({
      role: m.role,
      content: m.content,
    }));

    const body = {
      model: selectedModel,
      messages,
      max_tokens: parseInt($('maxTokens').value),
      stream,
    };

    const sys = $('systemPrompt').value.trim();
    if (sys) body.system = sys;

    setStatus(`请求中... [Anthropic] ${selectedModel}`);

    const res = await fetch(`${$('baseUrl').value}/v1/messages`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
      signal,
    });

    if (!res.ok) {
      const errText = await res.text();
      throw new Error(`${res.status}: ${errText}`);
    }

    let fullContent = '';
    let rawChunks = '';

    if (stream) {
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n');
        buffer = lines.pop() || '';

        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          const data = line.slice(6);
          rawChunks += data + '\n';

          try {
            const json = JSON.parse(data);
            // Anthropic SSE events
            if (json.type === 'content_block_delta') {
              const delta = json.delta?.text || '';
              fullContent += delta;
              bubble.innerHTML = escapeHtml(fullContent);
              $('messages').scrollTop = $('messages').scrollHeight;
            }
            if (json.type === 'message_delta' && json.usage) {
              $('tokenInfo').textContent =
                `Tokens: ${json.usage.input_tokens || '?'} in / ${json.usage.output_tokens || '?'} out`;
            }
            if (json.type === 'message_start' && json.message?.usage) {
              $('tokenInfo').textContent =
                `Tokens: ${json.message.usage.input_tokens} in / ... out`;
            }
          } catch {}
        }
      }
    } else {
      const json = await res.json();
      rawChunks = JSON.stringify(json, null, 2);
      fullContent = json.content?.map(c => c.text).join('') || '';
      bubble.innerHTML = escapeHtml(fullContent);

      if (json.usage) {
        $('tokenInfo').textContent =
          `Tokens: ${json.usage.input_tokens} in / ${json.usage.output_tokens} out`;
      }
    }

    rawDiv.textContent = rawChunks;
    chatHistory.push({ role: 'assistant', content: fullContent });
  }

  // Stop generation
  function stopGeneration() {
    if (abortController) abortController.abort();
    setStatus('已停止');
  }

  // Init
  checkConnection();
  fetchModels();
</script>
